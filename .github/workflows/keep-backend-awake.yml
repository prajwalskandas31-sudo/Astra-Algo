# Render's free plan puts the backend to sleep after 15 idle minutes, which would make the
# 09:15 / 09:16 IST strategy jobs miss. This pings the public /health probe every 10 minutes
# from 08:30 to 16:20 IST on weekdays (03:00-10:50 UTC) so the scheduler stays alive in market hours.
name: Keep backend awake (market hours)

on:
  schedule:
    - cron: "*/10 3-10 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://astra-algo.onrender.com/health; then exit 0; fi
            sleep 10
          done
          echo "Backend did not answer /health" && exit 1
